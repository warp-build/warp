[workspace]
members = [
  "crates/warp-cli",
  "crates/warp-server",
  "crates/warp-protocol",
  "crates/warp-build-engine",
  "crates/warp-build-language",
  "crates/warp-store",
]
resolver = "2"

[workspace.dependencies]
blake3 = "1.8.7"
cacache = "13.1.0"
clap = { version = "4.6.7", features = ["derive"] }
deno_core = "0.411.0"
deno_error = "0.7.1"
directories = "5.0.1"
guess_host_triple = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
